[develop]
script_dir=$base/lib/my_py_package
[install]
install_scripts=$base/lib/my_py_package

[flake8]
exclude =
    .git,
    __pycache__,
    build,
    install,
    prefix_override,
    *.egg-info,
    local_setup*,
    *sitecustomize*
max-line-length = 100
# Ignore docstring errors (D1xx), which are PEP 257 style violations
# and auto-generated file errors
ignore = E501,CNL100,D100,D101,D102,D103,D104,D107,I201
per-file-ignores =
    __init__.py: F401
