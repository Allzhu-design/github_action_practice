name: CI – Lint, Build & Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flake8 linter
        run: flake8 src/ tests/ --max-line-length=100 --statistics

  build:
    name: Build (install package)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: pip install -r requirements.txt

      - name: Verify package imports correctly
        run: python -c "from src.calculator import add, subtract, multiply, divide, power, factorial; print('Build OK')"

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  report:
    name: Report results to PR
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post CI summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Remove any previous bot CI summary comments
            for (const comment of comments) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.startsWith('## 🤖 CI Pipeline Summary')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            const lintResult  = '${{ needs.lint.result }}';
            const buildResult = '${{ needs.build.result }}';
            const testResult  = '${{ needs.test.result }}';

            const icon = (r) =>
              r === 'success'  ? '✅' :
              r === 'failure'  ? '❌' :
              r === 'skipped'  ? '⏭️' : '⚠️';

            const overall =
              [lintResult, buildResult, testResult].every(r => r === 'success')
                ? '✅ All checks passed!'
                : '❌ One or more checks failed.';

            const body = [
              '## 🤖 CI Pipeline Summary',
              '',
              `**Overall:** ${overall}`,
              '',
              '| Step  | Status |',
              '|-------|--------|',
              `| ${icon(lintResult)}  Lint (flake8)   | \`${lintResult}\`  |`,
              `| ${icon(buildResult)} Build (install) | \`${buildResult}\` |`,
              `| ${icon(testResult)}  Test (pytest)   | \`${testResult}\`  |`,
              '',
              `> Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
