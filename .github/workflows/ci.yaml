---
name: CI - Lint, Build & Test (ROS2)

on:
  pull_request:
    branches: ["**"]
  push: {}
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Enable debug logging'
        required: false
        default: false

env:
  PYTHON_VERSION: "3.11"
  ROS_DISTRO: "humble"

jobs:
  pre-commit:
    name: Pre-commit Hooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: .pre-commit-config.yaml

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.0

  build:
    name: Build ROS2 Package (colcon)
    runs-on: ubuntu-latest
    needs: pre-commit
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ros2_ws/build
            ros2_ws/install
          key: ${{ runner.os }}-colcon-${{ env.PYTHON_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-colcon-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-colcon-

      - name: Install ROS2 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install colcon-common-extensions setuptools

      - name: Build ROS2 package with colcon
        run: |
          cd ros2_ws
          colcon build --symlink-install

      - name: Verify package installation
        run: |
          cd ros2_ws
          ls -la install/my_py_package/lib/
          echo "✅ Build completed successfully"

  test:
    name: Test ROS2 Package
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ros2_ws/build
            ros2_ws/install
          key: ${{ runner.os }}-colcon-${{ env.PYTHON_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-colcon-${{ env.PYTHON_VERSION }}-
            ${{ runner.os }}-colcon-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov colcon-common-extensions

      - name: Run ROS2 package tests
        run: |
          cd ros2_ws
          colcon test --packages-select my_py_package

      - name: Display test results
        if: always()
        run: |
          cd ros2_ws
          colcon test-result --all

  report:
    name: Report results to PR
    runs-on: ubuntu-latest
    needs: [pre-commit, build, test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post CI summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Remove any previous bot CI summary comments
            for (const comment of comments) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.startsWith('## 🤖 CI Pipeline Summary')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            const precommitResult = '${{ needs.pre-commit.result }}';
            const buildResult     = '${{ needs.build.result }}';
            const testResult      = '${{ needs.test.result }}';

            const icon = (r) =>
              r === 'success'  ? '✅' :
              r === 'failure'  ? '❌' :
              r === 'skipped'  ? '⏭️' : '⚠️';

            const overall =
              [precommitResult, buildResult, testResult].every(r => r === 'success')
                ? '✅ All checks passed!'
                : '❌ One or more checks failed.';

            const body = [
              '## 🤖 CI Pipeline Summary (ROS2)',
              '',
              `**Overall:** ${overall}`,
              '',
              '| Step  | Status |',
              '|-------|--------|',
              `| ${icon(precommitResult)} Pre-commit Hooks | \`${precommitResult}\` |`,
              `| ${icon(buildResult)} Build (colcon)     | \`${buildResult}\`  |`,
              `| ${icon(testResult)}  Test (colcon)      | \`${testResult}\`   |`,
              '',
              `> Workflow run: [#${{ github.run_number }}](` +
              `${{ github.server_url }}/${{ github.repository }}/` +
              `actions/runs/${{ github.run_id }})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });